name: Build OniAkuma iOS IPA

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OniAkuma iOS IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Selecting optimal Xcode..."
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build Xcode Project (Release Fast)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 4 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log || {
              echo ""
              echo "==================== COMPILATION ERRORS ===================="
              grep -E "error:" build.log || tail -n 50 build.log
              echo "============================================================"
              exit 1
            }

      - name: Push Build Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== XCODEBUILD ERROR LOG ===" > build_failure.txt
          grep -E "error:" build.log >> build_failure.txt || tail -n 60 build.log >> build_failure.txt
          git add build_failure.txt
          git commit -m "build failure log [skip ci]" || true
          git push origin HEAD:main || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          
          cp ThreeOneOSFive/cr_*.dat "$APP_PATH/" 2>/dev/null || true
          cp ThreeOneOSFive/NextDNS.mobileconfig "$APP_PATH/" 2>/dev/null || true

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r9 OniAkuma_iOS.ipa Payload
          cp OniAkuma_iOS.ipa ZArchiver_iOS.ipa

          echo "=== IPA ARTIFACT GENERATED ==="
          ls -lh OniAkuma_iOS.ipa

      - name: Upload OniAkuma IPA
        uses: actions/upload-artifact@v4
        with:
          name: OniAkuma_iOS_IPA
          path: OniAkuma_iOS.ipa
          retention-days: 30

      - name: Create GitHub Release (On tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OniAkuma_iOS.ipa
            ZArchiver_iOS.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
