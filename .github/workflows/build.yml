name: Build Mizze iOS IPA

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mizze iOS IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Verify Menu cleanup boundaries
        run: |
          cat ThreeOneOSFive/helpers/MenuFileCleanup.swift scripts/test-menu-cleanup.swift > "$RUNNER_TEMP/mizze-cleanup-tests.swift"
          swift "$RUNNER_TEMP/mizze-cleanup-tests.swift"

      - name: Build Mizze
        run: |
          set -o pipefail
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 4 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mizze-build-failure-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package Mizze IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Mizze.app"
          test -d "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "Mizze"
          cp ThreeOneOSFive/cr_*.dat "$APP_PATH/"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r9 Mizze_iOS.ipa Payload
          unzip -tq Mizze_iOS.ipa
          ls -lh Mizze_iOS.ipa
          {
            echo '### Mizze IPA'
            echo 'Download the Mizze_iOS_IPA artifact below and extract Mizze_iOS.ipa.'
            echo 'The IPA is unsigned and needs a compatible signing method before installation.'
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Mizze IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mizze_iOS_IPA
          path: Mizze_iOS.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Mizze_iOS.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
