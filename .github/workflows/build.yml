name: Build OniAkuma Client IPA

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Client Game IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          echo "Listing Project Schemes & Targets:"
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build Xcode Project (Release)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Client IPA & TIPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          
          if [ -f "ThreeOneOSFive/Định vị.3105" ]; then
            cp "ThreeOneOSFive/Định vị.3105" "$APP_PATH/"
          elif [ -f "Định vị.3105" ]; then
            cp "Định vị.3105" "$APP_PATH/"
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r9 OniAkuma_Client.ipa Payload

          echo "=== CLIENT IPA ARTIFACT GENERATED ==="
          ls -lh OniAkuma_Client.ipa

      - name: Upload Client IPA
        uses: actions/upload-artifact@v4
        with:
          name: OniAkuma_Client_IPA
          path: OniAkuma_Client.ipa
          retention-days: 30

      - name: Create GitHub Release (On tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OniAkuma_Client.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
