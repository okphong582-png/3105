name: Build iOS IPA & TIPA

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Client IPA & Admin TIPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          echo "Listing Project Schemes & Targets:"
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build Xcode Project (Release)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Client IPA & Admin TIPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          
          # 1. Package Client IPA
          mkdir -p Payload_Client
          cp -r "$APP_PATH" Payload_Client/
          (cd Payload_Client && zip -r9 ../OniAkuma_Client.ipa .)
          zip -r9 OniAkuma_Client_Bundle.ipa Payload_Client
          mv OniAkuma_Client_Bundle.ipa OniAkuma_Client.ipa 2>/dev/null || true

          # 2. Package Admin Server Manager .tipa (TrollStore) and .ipa
          mkdir -p Payload_Admin
          cp -r "$APP_PATH" Payload_Admin/
          zip -r9 OniAkuma_Admin_Manager.ipa Payload_Admin
          cp OniAkuma_Admin_Manager.ipa OniAkuma_Admin_Manager.tipa

          echo "=== BUILD ARTIFACTS GENERATED ==="
          ls -lh OniAkuma_Client.ipa OniAkuma_Admin_Manager.ipa OniAkuma_Admin_Manager.tipa

      - name: Upload Client IPA
        uses: actions/upload-artifact@v4
        with:
          name: OniAkuma_Client_IPA
          path: OniAkuma_Client.ipa
          retention-days: 30

      - name: Upload Admin Server Manager TIPA & IPA
        uses: actions/upload-artifact@v4
        with:
          name: OniAkuma_Admin_Server_Manager_TIPA
          path: |
            OniAkuma_Admin_Manager.tipa
            OniAkuma_Admin_Manager.ipa
          retention-days: 30

      - name: Create GitHub Release (On tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OniAkuma_Client.ipa
            OniAkuma_Admin_Manager.tipa
            OniAkuma_Admin_Manager.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
