name: Build ZArchiver iOS IPA

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZArchiver iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          echo "Listing Project Schemes & Targets:"
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build Xcode Project (Release)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log || {
              echo ""
              echo "==================== COMPILATION ERRORS ===================="
              grep -E "error:" build.log || tail -n 50 build.log
              echo "============================================================"
              exit 1
            }

      - name: Package ZArchiver IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          
          cp ThreeOneOSFive/zarchiver_logo.png "$APP_PATH/" 2>/dev/null || true
          cp ThreeOneOSFive/cr_*.dat "$APP_PATH/" 2>/dev/null || true

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r9 ZArchiver_iOS.ipa Payload

          echo "=== ZARCHIVER IPA ARTIFACT GENERATED ==="
          ls -lh ZArchiver_iOS.ipa

      - name: Upload ZArchiver IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZArchiver_iOS_IPA
          path: ZArchiver_iOS.ipa
          retention-days: 30

      - name: Create GitHub Release (On tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZArchiver_iOS.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
